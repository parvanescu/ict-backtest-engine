spring.application.name=alert-service

# Local desktop app without authentication: only this machine can connect.
# Inside a container set SERVER_ADDRESS=0.0.0.0 and publish the port on the host's loopback only.
server.address=127.0.0.1
server.port=8080

# Adapter PUB endpoints every SUB socket connects to (env: ALERT_ZMQ_ENDPOINTS, comma-separated).
alert.zmq.endpoints=tcp://127.0.0.1:5556
alert.zmq.receive-timeout=200ms

# Browser origins allowed to open the WebSocket (env: ALERT_API_ALLOWED_ORIGIN_PATTERNS).
alert.api.allowed-origin-patterns=http://localhost:*,http://127.0.0.1:*
alert.api.heartbeat=10s
